[build-system]
requires = ["setuptools>=78.1.1"]  # 78.1.1 fixes PYSEC-2025-49
build-backend = "setuptools.build_meta"

[project]
name = "kvforge"
version = "0.1.0"
description = "A readable LLM inference runtime: paged KV cache, prefix caching, continuous batching, hybrid attention, MoE dispatch and speculative decoding."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["kvforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning"]
